[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visiomode-analysis"
version = "0.1.0"
description = 'Analysis package for Visiomode sessions'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Sophie Holland", email = "S.G.Holland@sms.ed.ac.uk" },
  { name = "Constantinos Eleftheriou", email = "Constantinos.Eleftheriou@ed.ac.uk" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "Click", 
  "pandas",
  "numpy",
  "scipy",
  "plotly",
  "Jinja2",
]

[project.urls]
Documentation = "https://github.com/DuguidLab/visiomode_analysis#readme"
Issues = "https://github.com/DuguidLab/visiomode_analysis/issues"
Source = "https://github.com/DuguidLab/visiomode_analysis"

[project.scripts]
visiomode-analysis = "visiomode_analysis:cli"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
  "pandas-stubs",
  "scipy-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visiomode_analysis"]
# The report templates match the *.html rule in .gitignore, which the build
# backend honours. Listing them as artifacts forces them into the wheel.
artifacts = ["src/visiomode_analysis/reports/templates/*.html"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.claude", "/docs"]
artifacts = ["src/visiomode_analysis/reports/templates/*.html"]

[tool.mypy]
files = ["src/visiomode_analysis", "tests"]

# Plotly ships no type information, so every import from it is an error under
# the default settings. Stubs for the remaining third-party deps are pinned in
# the dev dependency group instead of being fetched on the fly.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source_pkgs = ["visiomode_analysis"]
branch = true
parallel = true
omit = [
  "src/visiomode_analysis/__about__.py",
]

[tool.coverage.paths]
visiomode_analysis = ["src/visiomode_analysis", "*/visiomode-analysis/src/visiomode_analysis"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
